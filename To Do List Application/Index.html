<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List Application</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="todo-app">
      <h2>
        To-Do List 
        <img src="https://media.istockphoto.com/id/1005546132/vector/vector-cartoon-checklist-with-tablet-icon-in-comic-style-checklist-task-list-sign.jpg?s=612x612&w=0&k=20&c=CbZFu8rP6Be1aWE64xpArPYEzMyFrFg2f3ltwBlU_BY=">
      </h2>
      <div class="row">
        <input type="text" id="input-box" placeholder="Enter Your Task Here...">
        <button onclick="addTask()">ADD</button>
      </div>
      <ul id="list-container"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
